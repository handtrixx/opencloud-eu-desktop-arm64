id: com.handtrixxx.OpenCloud
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: opencloud
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/gtk-doc
      - '*.la'
      - '*.a'

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_WITH_QT6=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.15.0
    cleanup:
      - /bin
      - /lib/cmake
      - /mkspecs
      - /include

  - name: libregraphapi
    buildsystem: cmake-ninja
    subdir: client
    sources:
      - type: git
        url: https://github.com/opencloud-eu/libre-graph-api-cpp-qt-client.git
        tag: v1.0.7
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON

  - name: kdsingleapplication
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/KDAB/KDSingleApplication.git
        tag: v1.2.0
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /mkspecs

  - name: opencloud-eu-desktop
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: /build/desktop
      - type: file
        path: /build/src/com.handtrixxx.OpenCloud.metainfo.xml
        dest-filename: com.handtrixxx.OpenCloud.metainfo.xml
      - type: file
        path: /build/src/favicon.svg
        dest-filename: com.handtrixxx.OpenCloud.svg
    post-install:
      - install -Dm644 com.handtrixxx.OpenCloud.metainfo.xml /app/share/metainfo/com.handtrixxx.OpenCloud.metainfo.xml
      - install -Dm644 com.handtrixxx.OpenCloud.svg /app/share/icons/hicolor/scalable/apps/com.handtrixxx.OpenCloud.svg
      - cp src/gui/opencloud.desktop /app/share/applications/com.handtrixxx.OpenCloud.desktop
      - desktop-file-edit --set-key=Icon --set-value=com.handtrixxx.OpenCloud /app/share/applications/com.handtrixxx.OpenCloud.desktop
      - desktop-file-edit --set-key=Exec --set-value=opencloud /app/share/applications/com.handtrixxx.OpenCloud.desktop
      - rm -f /app/share/applications/opencloud.desktop /app/share/applications/opencloudcmd.desktop
